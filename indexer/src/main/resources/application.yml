server:
  port: 8082

spring:
  application:
    name: indexer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: indexer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.searchly.common"
        spring.json.value.default.type: dev.searchly.common.IndexingEvent
        metadata.max.age.ms: 5000
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: "true"

searchly:
  opensearch:
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
    scheme: http
  embedding:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8083}
  kafka:
    retry1-topic: indexing.retry1
    retry2-topic: indexing.retry2
    retry3-topic: indexing.retry3
    dlq-topic: indexing.dlq

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
