name: searchly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: searchly
      POSTGRES_PASSWORD: searchly
      POSTGRES_DB: searchly
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports: ["9092:9092", "29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  search-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.search-api
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/searchly
      POSTGRES_USER: searchly
      POSTGRES_PASSWORD: searchly
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      OPENSEARCH_HOST: opensearch
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      opensearch: { condition: service_healthy }
      kafka:    { condition: service_healthy }

  indexer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.indexer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OPENSEARCH_HOST: opensearch
    depends_on:
      opensearch: { condition: service_healthy }
      kafka:    { condition: service_healthy }

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      REDIS_HOST: redis
      SEARCH_API_URI: http://search-api:8081
    ports: ["8080:8080"]
    depends_on:
      redis:      { condition: service_healthy }
      search-api: { condition: service_started }

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4317:4317", "4318:4318"]
