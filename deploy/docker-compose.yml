name: searchly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: searchly
      POSTGRES_PASSWORD: searchly
      POSTGRES_DB: searchly
    ports: ["5432:5432"]
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchly"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # kNN is enabled by default in OpenSearch 2.x — do not set plugins.knn.enabled
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports: ["9092:9092", "29092:29092"]
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Sentence-transformers sidecar — all-MiniLM-L6-v2, CPU-only, ~1.5 GB image.
  # Model is baked into the image at build time so first startup is instant.
  embedding-service:
    build:
      context: ../embedding-service
      dockerfile: Dockerfile
    ports: ["18083:8083"]
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ollama — model is pulled once on first start and persisted in the named volume.
  # Subsequent starts skip the download and serve immediately.
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 5g
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Intelligence Agent — answers queries using RAG over indexed knowledge + live log access.
  #
  # Management API (port 8084):
  #   POST   /api/v1/customers                         register new customer (solution phase)
  #   GET    /api/v1/customers                         list all
  #   POST   /api/v1/customers/{id}/environments/{env} add cluster env (dev/test/staging/prod)
  #   DELETE /api/v1/customers/{id}/environments/{env} remove env
  #
  # The answer endpoint is called by search-api (not directly by users):
  #   POST   /api/v1/agent/answer
  intelligence-agent:
    build:
      context: ../warehouse-agent
      dockerfile: Dockerfile
    environment:
      OLLAMA_URL:      http://ollama:11434
      OLLAMA_MODEL:    ${OLLAMA_MODEL:-llama3.2:3b}
      SEARCHLY_URL:    http://gateway:8080
      SEARCHLY_TENANT: ${SEARCHLY_TENANT:-default}
      CUSTOMERS_YML:   /app/customers.yml           # imported once at startup
      CUSTOMERS_DB:    /app/data/customers_db.json  # live persistent registry
      AUTH_DB:         /app/data/auth_db.json       # API key store
      PRODUCTS_YML:    /app/products.yml            # canonical product list (read-only)
      # AUTH_ENABLED: "false"  ← default: no auth, open access (good for internal/dev)
      # AUTH_ENABLED: "true"   ← enable tenant isolation (required for customer-facing)
      AUTH_ENABLED:    ${AUTH_ENABLED:-false}
      # ADMIN_API_KEY: set this to a fixed key, otherwise one is auto-generated
      # and printed to the logs on first start (docker compose logs intelligence-agent)
      ADMIN_API_KEY:   ${ADMIN_API_KEY:-}
    volumes:
      # Read-only seed: imported once at startup
      - ../connectors/customers.yml:/app/customers.yml:ro
      - ../connectors/products.yml:/app/products.yml:ro
      # Read-write persistent registry: survives restarts, updated via API
      - intelligence-agent-data:/app/data
      # SSH key for kubectl bastion access (mount your actual key)
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    ports: ["18084:8084"]
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      ollama: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8084/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  search-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.search-api
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/searchly
      POSTGRES_USER: searchly
      POSTGRES_PASSWORD: searchly
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      OPENSEARCH_HOST: opensearch
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # Intelligence agent URL — enables live operational query routing
      WAREHOUSE_AGENT_URL: http://intelligence-agent:8084
    ports: ["8081:8081"]
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      postgres:          { condition: service_healthy }
      redis:             { condition: service_healthy }
      opensearch:        { condition: service_healthy }
      kafka:             { condition: service_healthy }
      embedding-service: { condition: service_healthy }
      ollama:            { condition: service_healthy }
      intelligence-agent: { condition: service_healthy }

  indexer:
    build:
      context: ../py-indexer
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      OPENSEARCH_HOST: opensearch
      EMBEDDING_SERVICE_URL: http://embedding-service:8083
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    depends_on:
      opensearch:        { condition: service_healthy }
      kafka:             { condition: service_healthy }
      embedding-service: { condition: service_healthy }

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      REDIS_HOST: redis
      SEARCH_API_URI: http://search-api:8081
    ports: ["18080:8080"]
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      redis:      { condition: service_healthy }
      search-api: { condition: service_started }

  # ── Automatic sync scheduler ──────────────────────────────────────────────
  # Runs automatically on `docker compose up -d`.
  # Two tracks:
  #   A. Customer logs + deployment state  — every SYNC_CUSTOMER_INTERVAL_MIN (default: 5)
  #   B. Full shared sync (Jira + Confluence + repos) — every SYNC_FULL_INTERVAL_HOURS (default: 4)
  # On first start: waits for search-api, then immediately runs a full sync.
  #
  # Watch live: docker compose logs sync-cron -f
  sync-cron:
    build:
      context: ../connectors
      dockerfile: Dockerfile
    command: ["python", "scheduler.py"]
    env_file:
      - ../connectors/.env
    environment:
      SEARCHLY_URL:               http://search-api:8081
      SYNC_STATE_DIR:             /data
      SYNC_DEPLOY_INTERVAL_MIN:   ${SYNC_DEPLOY_INTERVAL_MIN:-60}   # deployment state refresh
      SYNC_FULL_INTERVAL_HOURS:   ${SYNC_FULL_INTERVAL_HOURS:-4}    # Jira + Confluence + repos
      # SYNC_STARTUP_WAIT_SEC:    90    # grace period before very first sync
    volumes:
      # .sync_state.json persists here so incremental indexing survives restarts
      - sync-state:/data
      # product and customer config — same source as intelligence-agent
      - ../connectors/products.yml:/app/products.yml:ro
      - ../connectors/customers.yml:/app/customers.yml:ro
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      search-api: { condition: service_started }
    restart: unless-stopped

  # ── Manual / one-shot sync ────────────────────────────────────────────────
  # Use this when you want to force-sync right now without waiting for the schedule:
  #   docker compose run --rm connectors               # full sync
  #   docker compose run --rm connectors python sync.py --only jira
  #   docker compose run --rm connectors python sync.py --only repos --force
  connectors:
    build:
      context: ../connectors
      dockerfile: Dockerfile
    env_file:
      - ../connectors/.env
    environment:
      SEARCHLY_URL: http://search-api:8081
    volumes:
      - sync-state:/data   # shares incremental state with sync-cron
    depends_on:
      search-api: { condition: service_started }
    profiles: ["sync"]   # excluded from `up`; run explicitly with `run --rm connectors`

  # prometheus — optional observability; comment out if port 9090 is already allocated
  # prometheus:
  #   image: prom/prometheus:latest
  #   volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
  #   ports: ["9090:9090"]

  # jaeger — optional distributed tracing; comment out if ports 4317/4318/16686 are already allocated
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   ports: ["16686:16686", "4317:4317", "4318:4318"]

volumes:
  ollama-data:           # persists downloaded Ollama models across restarts
  intelligence-agent-data:  # persists customer registry (customers_db.json) across restarts
  sync-state:            # persists .sync_state.json (incremental repo indexing state)
